# ============================================================
# Sveltia CMS Configuration — Kauai Hot Yoga
# ============================================================
#
# SETUP REQUIRED BEFORE GOING LIVE:
#
# 1. Replace GITHUB_OWNER/GITHUB_REPO with your actual GitHub repo
#    e.g.  repo: camerongaut/kauai-hot-yoga
#
# 2. Set up a GitHub OAuth App:
#    - Go to GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#    - Homepage URL: https://your-site.pages.dev (or your custom domain)
#    - Authorization callback URL: https://your-auth-worker.workers.dev/callback
#
# 3. Deploy the Sveltia CMS Auth worker to Cloudflare:
#    https://github.com/sveltia/sveltia-cms-auth
#    Then replace YOUR_AUTH_WORKER below with your worker's subdomain.
#
# 4. After deploying the auth worker, set GITHUB_CLIENT_ID and
#    GITHUB_CLIENT_SECRET as secrets in the Cloudflare Worker dashboard.
# ============================================================

backend:
  name: github
  repo: seegodesign/kauai-hot-yoga
  branch: main
  base_url: https://kaui-hot-yoga-sveltia-cms-auth.seegodesign.workers.dev

media_folder: public/images
public_folder: /images

collections:
  # ── Site Settings ─────────────────────────────────────────
  - name: settings
    label: Site Settings
    files:
      - name: main
        label: Studio Info
        file: src/content/settings/main.yml
        fields:
          - { label: Studio Name, name: studio_name, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Email, name: email, widget: string }
          - label: Address
            name: address
            widget: object
            fields:
              - { label: Street, name: street, widget: string }
              - { label: City, name: city, widget: string }
              - { label: State, name: state, widget: string }
              - { label: ZIP Code, name: zip, widget: string }
          - { label: Latitude, name: latitude, widget: number, value_type: float, hint: "e.g. 21.978104" }
          - { label: Longitude, name: longitude, widget: number, value_type: float, hint: "e.g. -159.368038" }
          - label: Business Hours
            name: business_hours
            widget: list
            summary: "{{fields.day}}: {{fields.hours}}"
            fields:
              - { label: Day, name: day, widget: string, hint: "e.g. Monday" }
              - { label: Hours, name: hours, widget: string, hint: "e.g. 8:30 AM-7:30 PM" }
          - label: Social Links
            name: social
            widget: object
            fields:
              - { label: Instagram URL, name: instagram, widget: string, required: false }
              - { label: Facebook URL, name: facebook, widget: string, required: false }
              - { label: Google Review URL, name: google_review_url, widget: string, required: false }
              - { label: Yelp Review URL, name: yelp_review_url, widget: string, required: false }
              - { label: Social Share Image, name: social_share_image, widget: image, required: false, hint: "Used as the default image for link previews when pages do not set their own social image. Recommended size: 1200x630." }
      - name: footer
        label: Footer Content
        file: src/content/footer/footer.yml
        fields:
          - label: Short Description
            name: description
            widget: text
            hint: "A brief description of the studio shown in the footer"
      - name: page_heroes
        label: Page Hero Images
        file: src/content/pageHeroSettings/main.yml
        fields:
          - label: Home Page
            name: home
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: About Page
            name: about
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Blog Page
            name: blog
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Classes Page
            name: classes
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Community Page
            name: community
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Contact Page
            name: contact
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Cold Plunge Page
            name: cold_plunge
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: FAQ Page
            name: faq
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Gift Card Page
            name: gift_card
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: New Here Page
            name: new_here
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Pricing Page
            name: pricing
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Schedule Page
            name: schedule
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Teachers Page
            name: teachers
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: Workshops Page
            name: workshops
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }
          - label: 9D Breathwork Page
            name: breathwork
            widget: object
            fields:
              - { label: Desktop Image, name: desktop, widget: image }
              - { label: Mobile Image, name: mobile, widget: image }

  # ── Home Page ─────────────────────────────────────────────
  - name: home
    label: Home Page
    files:
      - name: main
        label: Home Page Content
        file: src/content/home/main.yml
        fields:
          - { label: SEO Title, name: seo_title, widget: string }
          - { label: SEO Description, name: seo_description, widget: text }
          - label: Hero Section
            name: hero_heading
            widget: string
            hint: The main headline in the hero
          - label: Hero Subheading
            name: hero_subheading
            widget: text
          - label: Primary CTA Button
            name: cta_primary
            widget: object
            fields:
              - { label: Button Text, name: text, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Secondary CTA Button
            name: cta_secondary
            widget: object
            fields:
              - { label: Button Text, name: text, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Explainer Heading
            name: explainer_heading
            widget: string
          - label: Explainer Paragraphs
            name: explainer_paragraphs
            widget: list
            field: { label: Paragraph, name: text, widget: text }
          - label: New Here Section Image
            name: new_here_image
            widget: image
            hint: Upload/select a WebP image when possible
          - { label: "CTA Strip Eyebrow", name: cta_strip_eyebrow, widget: string, required: false }
          - label: CTA Strip Heading
            name: cta_strip_heading
            widget: string
          - label: CTA Strip Subheading
            name: cta_strip_subheading
            widget: text
          - label: CTA Strip Primary Button
            name: cta_strip_primary
            widget: object
            fields:
              - { label: Button Text, name: text, widget: string }
              - { label: Link, name: href, widget: string }
          - label: CTA Strip Secondary Button
            name: cta_strip_secondary
            widget: object
            fields:
              - { label: Button Text, name: text, widget: string }
              - { label: Link, name: href, widget: string }
          - { label: Reviews Eyebrow, name: reviews_eyebrow, widget: string, required: false }
          - { label: Reviews Heading, name: reviews_heading, widget: string, required: false }
          - { label: Reviews Subtitle, name: reviews_subtitle, widget: string, required: false }
          - { label: Why Hot Yoga Eyebrow, name: why_hot_yoga_eyebrow, widget: string, required: false }
          - { label: Why Hot Yoga Heading, name: why_hot_yoga_heading, widget: string, required: false }
          - label: Why Hot Yoga Paragraphs
            name: why_hot_yoga_paragraphs
            widget: list
            field: { label: Paragraph, name: text, widget: text }
            required: false
          - { label: Why Hot Yoga CTA, name: why_hot_yoga_cta, widget: string, required: false }
          - { label: Amenities Eyebrow, name: amenities_eyebrow, widget: string, required: false }
          - { label: Amenities Heading, name: amenities_heading, widget: string, required: false }
          - label: Amenities
            name: amenities
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
          - { label: New Here Section Heading, name: new_here_section_heading, widget: string, required: false }
          - label: New Here Quick Tips
            name: new_here_quick_tips
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
          - { label: New Here CTA Text, name: new_here_cta_text, widget: string, required: false }
          - { label: New Here CTA Link, name: new_here_cta_href, widget: string, required: false }
          - { label: Location Eyebrow, name: location_eyebrow, widget: string, required: false }
          - { label: Location Heading, name: location_heading, widget: string, required: false }
          - { label: Location Body, name: location_body, widget: text, required: false }
          - { label: Mission Eyebrow, name: mission_eyebrow, widget: string, required: false }
          - { label: Mission Heading, name: mission_heading, widget: string, required: false }
          - label: Mission Paragraphs
            name: mission_paragraphs
            widget: list
            field: { label: Paragraph, name: text, widget: text }
            required: false
          - { label: Mission CTA Text, name: mission_cta_text, widget: string, required: false }
          - { label: Mission CTA Link, name: mission_cta_href, widget: string, required: false }
          - { label: Teachers Section Eyebrow, name: teachers_section_eyebrow, widget: string, required: false }
          - { label: Teachers Section Heading, name: teachers_section_heading, widget: string, required: false }
          - { label: Teachers Section Subtitle, name: teachers_section_subtitle, widget: text, required: false }
          - { label: Teachers Section CTA Text, name: teachers_section_cta_text, widget: string, required: false }

  # ── About Page ────────────────────────────────────────────
  - name: about
    label: About Page
    files:
      - name: main
        label: About Page Content
        file: src/content/about/main.yml
        fields:
          - { label: SEO Title, name: seo_title, widget: string }
          - { label: SEO Description, name: seo_description, widget: text }
          - { label: Hero Eyebrow, name: hero_eyebrow, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Subtitle, name: hero_subtitle, widget: text }
          - { label: Studio Eyebrow, name: studio_eyebrow, widget: string }
          - { label: Studio Heading, name: studio_heading, widget: string }
          - { label: Studio Paragraph, name: studio_paragraph, widget: text }
          - label: Studio Features
            name: studio_features
            widget: list
            field: { label: Feature, name: feature, widget: string }
          - label: Studio CTA Button
            name: studio_cta
            widget: object
            fields:
              - { label: Button Text, name: text, widget: string }
              - { label: Link, name: href, widget: string }
          - { label: Studio Image (Desktop), name: studio_image_desktop, widget: image, hint: "Upload/select a WebP image when possible" }
          - { label: Studio Image (Mobile), name: studio_image_mobile, widget: image, hint: "Upload/select a WebP image when possible" }
          - { label: Studio Image Alt Text, name: studio_image_alt, widget: string }
          - { label: Bottom CTA Heading, name: cta_heading, widget: string }
          - { label: Bottom CTA Paragraph, name: cta_paragraph, widget: text }
          - label: Bottom CTA Primary Button
            name: cta_primary
            widget: object
            fields:
              - { label: Button Text, name: text, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Bottom CTA Secondary Button
            name: cta_secondary
            widget: object
            fields:
              - { label: Button Text, name: text, widget: string }
              - { label: Link, name: href, widget: string }

  # ── Workshops Page ────────────────────────────────────────
  - name: workshopsPage
    label: Workshops Page
    files:
      - name: main
        label: Workshops Page Content
        file: src/content/workshopsPage/main.yml
        fields:
          - { label: SEO Title, name: seo_title, widget: string }
          - { label: SEO Description, name: seo_description, widget: text }
          - { label: Hero Eyebrow, name: hero_eyebrow, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Subtitle, name: hero_subtitle, widget: text }
          - { label: Reserve Button Text, name: reserve_button_text, widget: string }
          - { label: Reserve Button Link, name: reserve_button_href, widget: string }
          - label: Workshops
            name: workshops
            widget: list
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Time, name: time, widget: string }
              - { label: Instructor, name: instructor, widget: string }
              - { label: Capacity, name: capacity, widget: string }
              - { label: Price, name: price, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image, required: false }
          - { label: Benefits Section Heading, name: benefits_heading, widget: string }
          - { label: Benefits Section Intro, name: benefits_intro, widget: text }
          - label: Benefits
            name: benefits
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }

  # ── 9D Breathwork Page ───────────────────────────────────
  - name: breathworkPage
    label: 9D Breathwork Page
    files:
      - name: main
        label: 9D Breathwork Content
        file: src/content/breathworkPage/main.yml
        fields:
          - { label: SEO Title, name: seo_title, widget: string }
          - { label: SEO Description, name: seo_description, widget: text }
          - { label: Hero Eyebrow, name: hero_eyebrow, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Subtitle, name: hero_subtitle, widget: text }
          - { label: What Is Section Heading, name: what_is_heading, widget: string }
          - label: Intro Blocks
            name: intro_blocks
            widget: list
            summary: "{{fields.title}}"
            min: 1
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Image Alt Text, name: image_alt, widget: string }
              - { label: Image On Right, name: image_right, widget: boolean, default: true, hint: "Turn off to place image on the left on desktop" }
          - label: Benefits
            name: benefits
            widget: list
            summary: "{{fields.title}}"
            min: 1
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: Sessions Section Heading, name: sessions_heading, widget: string }
          - { label: What To Expect Heading, name: expect_heading, widget: string }
          - label: What To Expect Cards
            name: expectations
            widget: list
            summary: "{{fields.title}}"
            min: 1
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }

  # ── Cold Plunge Page ─────────────────────────────────────
  - name: coldPlungePage
    label: Cold Plunge Page
    files:
      - name: main
        label: Cold Plunge Content
        file: src/content/coldPlungePage/main.yml
        fields:
          - { label: SEO Title, name: seo_title, widget: string }
          - { label: SEO Description, name: seo_description, widget: text }
          - { label: Hero Eyebrow, name: hero_eyebrow, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Subtitle, name: hero_subtitle, widget: text }
          - { label: Science Section Heading, name: science_heading, widget: string }
          - { label: Science Section Intro, name: science_intro, widget: text }
          - label: Benefits
            name: benefits
            widget: list
            summary: "{{fields.title}}"
            min: 1
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: Options Section Heading, name: options_heading, widget: string }
          - { label: Options Button Text, name: options_cta_text, widget: string }
          - { label: How It Works Heading, name: how_it_works_heading, widget: string }
          - label: How It Works Steps
            name: steps
            widget: list
            summary: "{{fields.title}}"
            min: 1
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: Safety Section Heading, name: safety_heading, widget: string }
          - { label: Safety Section Intro, name: safety_intro, widget: text }
          - label: Safety Points
            name: safety_points
            widget: list
            min: 1
            field: { label: Point, name: point, widget: string }

  # ── Offerings ─────────────────────────────────────────────
  - name: offerings
    label: Offerings
    folder: src/content/offerings
    create: false
    format: yaml
    identifier_field: title
    fields:
      - label: Slug
        name: slug
        widget: select
        options:
          - yoga-classes
          - workshops
          - breathwork
          - cold-plunge
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Page Link, name: href, widget: string }
      - { label: Photo, name: image, widget: image }
      - label: Features List
        name: items
        widget: list
        field: { label: Item, name: item, widget: string }
      - { label: Display Order, name: order, widget: number, default: 0 }

  # ── Testimonials ──────────────────────────────────────────
  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    create: true
    format: yaml
    identifier_field: name
    sortable_fields: ['order', 'name', 'source']
    summary: "{{order}} · {{name}} ({{source}}) — {{highlight}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Location, name: location, widget: string, hint: "e.g. Visiting from California" }
      - label: Rating
        name: rating
        widget: number
        default: 5
        min: 1
        max: 5
      - { label: Review Text, name: text, widget: text }
      - { label: Highlight Quote, name: highlight, widget: string, hint: "Short pull-quote shown prominently" }
      - label: Review Source
        name: source
        widget: select
        options:
          - Google
          - Yelp
      - { label: Display Order, name: order, widget: number, default: 0 }

  # ── Blog ──────────────────────────────────────────────────
  - name: community
    label: Community Members
    folder: src/content/community
    create: true
    format: yaml
    identifier_field: name
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role / Title, name: role, widget: string, required: false, hint: "e.g. Surf Instructor, Massage Therapist" }
      - { label: Bio, name: bio, widget: text }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Website URL, name: website, widget: string, required: false }
      - { label: Instagram URL, name: instagram, widget: string, required: false }
      - { label: Display Order, name: order, widget: number, default: 0 }

  - name: teachers
    label: Teachers
    folder: src/content/teachers
    create: true
    format: yaml
    identifier_field: name
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Title / Role, name: title, widget: string, required: false, hint: "e.g. Lead Instructor, Breathwork Guide" }
      - { label: Bio, name: bio, widget: text }
      - { label: Photo, name: photo, widget: image, required: false }
      - label: Specialties
        name: specialties
        widget: list
        field: { label: Specialty, name: specialty, widget: string }
        required: false
      - { label: Instagram URL, name: instagram, widget: string, required: false }
      - { label: Display Order, name: order, widget: number, default: 0 }

  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    format: frontmatter
    extension: md
    identifier_field: title
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, hint: "Short summary shown on the blog listing page and in search results" }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Author, name: author, widget: string, default: "Kauai Hot Yoga" }
      - { label: Cover Image, name: image, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
        required: false
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "Drafts are hidden from the public blog" }
      - { label: Body, name: body, widget: markdown }

  # ── Pricing Plans ─────────────────────────────────────────
  - name: pricingPlans
    label: Pricing Plans
    label_singular: Pricing Plan
    folder: src/content/pricingPlans
    create: true
    format: yaml
    identifier_field: name
    summary: "{{category}} — {{name}} ({{price}})"
    fields:
      - { label: Name, name: name, widget: string, hint: "e.g. 10-Class Pack" }
      - { label: Price, name: price, widget: string, hint: "e.g. $219" }
      - { label: Period, name: period, widget: string, required: false, hint: "e.g. month or year (leave blank for one-time)" }
      - { label: Description, name: description, widget: string, hint: "Short tagline shown under the price" }
      - label: Features
        name: features
        widget: list
        field: { label: Feature, name: feature, widget: string }
      - { label: Highlight as Popular, name: popular, widget: boolean, default: false }
      - label: Category
        name: category
        widget: select
        options:
          - { label: Drop-In, value: drop-in }
          - { label: Class Pack, value: class-pack }
          - { label: Membership, value: membership }
      - { label: Sort Order, name: order, widget: number, default: 0 }

  # ── Pricing Specials ──────────────────────────────────────
  - name: pricingSpecials
    label: Pricing Specials
    label_singular: Special Offer
    folder: src/content/pricingSpecials
    create: true
    format: yaml
    identifier_field: name
    summary: "{{name}} ({{price}})"
    fields:
      - { label: Name, name: name, widget: string, hint: "e.g. Traveler Week" }
      - { label: Subtitle, name: subtitle, widget: string, hint: "e.g. For Visitors" }
      - { label: Badge, name: badge, widget: string, hint: "e.g. 7 Days" }
      - { label: Price, name: price, widget: string, hint: "e.g. $89" }
      - { label: Description, name: description, widget: string, hint: "Short tagline shown under the price" }
      - label: Features
        name: features
        widget: list
        field: { label: Feature, name: feature, widget: string }
      - { label: CTA Button Text, name: cta_text, widget: string }
      - { label: CTA Button URL, name: cta_url, widget: string }
      - { label: Sort Order, name: order, widget: number, default: 0 }

  # ── Cold Plunge Pricing ───────────────────────────────────
  - name: coldPlungePricing
    label: Pricing Cold Plunge
    label_singular: Cold Plunge Option
    folder: src/content/coldPlungePricing
    create: true
    format: yaml
    identifier_field: name
    summary: "{{name}} ({{price}})"
    fields:
      - { label: Name, name: name, widget: string, hint: "e.g. Cold Plunge Only" }
      - { label: Price, name: price, widget: string, hint: "e.g. $15" }
      - { label: Badge, name: badge, widget: string, required: false, hint: "e.g. Save $25" }
      - { label: Description, name: description, widget: text }
      - label: Features
        name: features
        widget: list
        field: { label: Feature, name: feature, widget: string }
      - { label: Buy Now URL, name: cta_url, widget: string }
      - { label: Sort Order, name: order, widget: number, default: 0 }

