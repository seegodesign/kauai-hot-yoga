science_heading: The Science of Cold
science_intro: Cold water immersion has been used for centuries as a healing practice. Modern science confirms its powerful benefits for both body and mind.
benefits:
  - title: Enhanced Recovery
    description: Reduce inflammation and speed up muscle recovery after workouts
  - title: Boost Energy
    description: Increase alertness and energy levels through cold exposure
  - title: Improved Circulation
    description: Strengthen cardiovascular system and improve blood flow
  - title: Immune Support
    description: Stimulate immune response and increase white blood cell production
  - title: Mental Resilience
    description: Build mental toughness and stress tolerance
  - title: Mood Enhancement
    description: Natural endorphin release for improved mood and wellbeing
options_heading: Cold Plunge Options
options_cta_text: Book Now
how_it_works_heading: How It Works
steps:
  - title: Prepare
    description: Start with breathwork or a hot yoga class. We will guide you on breathing techniques before entering the cold.
  - title: Plunge
    description: Enter slowly and focus on your breath. Start with 1-3 minutes and build up over time.
  - title: Warm Up
    description: Exit mindfully and warm up naturally. Use our sauna or take a warm shower.
  - title: Integrate
    description: "Relax, hydrate, and notice the effects: increased alertness, mood elevation, and calm."
safety_heading: Safety First
safety_intro: "Cold plunge is generally safe for most people, but please note:"
safety_points:
  - Consult your doctor if you have heart conditions, high blood pressure, or are pregnant
  - Never plunge alone - staff supervision is always provided
  - Start with shorter durations and build gradually
  - Listen to your body and exit if you feel dizzy or uncomfortable
  - Avoid alcohol before or after cold plunge sessions
