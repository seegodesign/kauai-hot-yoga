workshops:
  - title: 9D Breathwork & Meditation Intensive
    date: September 27
    time: 10:30-12:30PM
    instructor: Garland Hume
    capacity: Limited to 14 students
    price: $75
    description: |-
      Freeze Release

      This journey is for the person who feels emotionally disconnected from life.

      Not overwhelmed. Not highly anxious. Just... switched off.

      You may be functioning on the outside, showing up for work, family, and responsibilities, yet underneath there's a lingering sense of numbness, fatigue, emptiness, or a complete lack of motivation. The things that once lit you up no longer seem to reach you. Joy feels distant. Purpose feels muted. You know you're alive, but you don't fully feel alive.

      Freeze Release was designed for those experiencing nervous system shutdown, emotional flatlining, burnout, or dissociation. If you've spent months or years surviving stress by disconnecting from your body, emotions, and vitality, this journey provides a safe, structured pathway back into feeling. Not through force. Not through motivation hacks. Through nervous system reawakening.

      Description
      Freeze Release is a 61-minute somatic breathwork experience designed to gently guide the nervous system out of dorsal vagal shutdown and back into a state of embodied aliveness.

      Many breathwork journeys focus on calming anxiety or reducing stress. This one serves a different purpose. It was created for moments when the nervous system has gone beyond activation and into conservation mode—when exhaustion, numbness, disconnection, and emotional flatness have become the body's primary survival strategy.

      The journey begins with subtle body awareness and gentle warming breaths, creating a sense of safety before gradually introducing deeper levels of energy and sensation. Through carefully layered breath patterns, vocal vibration, somatic movement, and progressive activation, the body is invited to thaw, soften, and reawaken at its own pace.

      As the session unfolds, stagnant energy begins to move. Breath holds create moments of expansion. Vocal release helps unlock areas of suppression and self-protection. Rhythmic breathing generates momentum without overwhelm. What emerges is not a temporary high, but a gradual return to presence, sensation, and vitality.

      The experience concludes with an extended integration phase that anchors awareness into the five senses, helping you reconnect with your environment, your body, and the simple experience of being fully here.

      Journey Flow & Breakdown
    image: /images/9D Breathwork.jpg
  - title: 'From Reflection to Action: A 7-Week Chakra Journey'
    date: Sundays, August 16-September 27
    time: 3-4:15PM
    instructor: Kat Clark
    capacity: Limited to 12 students
    price: $280
    description: 'We’re excited to welcome Kat Clark for REVERB: Embody Your Purpose, a 7-week chakra-based journey held Sundays from 3:00–4:15 PM at Kauai Hot Yoga, August 16 through September 27. This transformative series is designed to bridge the gap between self-awareness and action, helping participants move beyond cycles of reflection into aligned, purposeful living. Each session blends gentle movement, sound healing, nervous system repatterning, and guided workbook practices to support embodied growth, emotional integration, and inner resilience. REVERB offers a supportive space to deepen self-trust, cultivate clarity, and take courageous, grounded steps toward meaningful change.'
    image: /images/kat clark.jpg
  - title: Reiki Level 2 Training
    date: Sunday, October 4th
    time: 11:30AM-5PM
    instructor: Cathy Hume
    capacity: Limited to 8 students
    price: $250
    description: |-
      Reiki Level Two (Okuden) – Deepening the Practice

      Reiki Level Two expands your ability to work with energy beyond the physical body. You’ll learn sacred Reiki symbols and how to use them for emotional healing, mental clarity, distance healing, and working with past or future patterns. This level often marks a profound shift—strengthening intuition, sensitivity, and confidence in your practice.

      Ideal for those who wish to work more intentionally with others, integrate Reiki into their professional offerings, or deepen their spiritual practice.

      In order to attend the Reiki Level 2 training you must already have been certified in Level 1 Reiki at least 6 months prior. If you attended Level 1 training with Cathy Hume last year, please make sure you have completed all your homework and received the certification from Cathy before attending level 2.
    image: /images/person-conducting-reiki-therapy.jpg
  - title: Reiki Level 1 Training
    date: Sunday, October 11th
    time: 11:30AM-5PM
    instructor: Cathy Hume
    capacity: Limited to 8 students
    price: $150
    description: |-
      Reiki Level One (Shoden) – Foundations of Energy Healing

      Reiki Level One is an initiation into the healing art of Reiki and a powerful starting point for self-care and personal awareness. In this training, you’ll learn the history and principles of Reiki, how to work with universal life-force energy, and how to offer hands-on healing to yourself and others. Through attunement, guided practice, and reflection, students often experience a heightened sense of presence, relaxation, and connection.

      Perfect for beginners, yoga practitioners, and anyone seeking a deeper relationship with their own healing journey.
    image: /images/person-conducting-reiki-therapy (1).jpg
