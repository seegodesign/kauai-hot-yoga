workshops:
  - title: 9D Breathwork & Meditation Intensive
    date: November !
    time: 2-5PM
    instructor: Garland Hume
    capacity: Limited to 14 students
    price: $75
    description: |-
      Theme: Healing the Mother Wound:

      Who is it for?
      This journey is for anyone carrying the weight of maternal relationships that felt unseen, unheard, or burdened by high expectations. It is specifically designed for the "people-pleasers," those who struggle with setting boundaries, and individuals ready to confront the suppressed anger or longing rooted in their childhood. If you are ready to stop carrying the emotional debt of previous generations and finally mother yourself with unconditional love, this is your sanctuary.

      Description:
      Healing the Mother Wound is an immersive 9D masterclass in Generational Alchemy. Spanning nearly two hours, this journey uses a specific "Two-In, One-Out" mouth breathing technique to bypass the analytical mind and enter the deep tissues where trauma is stored. This isn't a session for "fixing" or "blaming"; it is a session for witnessing and releasing.

      Guided by Mona’s compassionate presence, you will move through layers of shame, grief, and tenderness. You’ll be invited to meet your younger self—the version of you that first learned how to survive maternal dynamics—and provide the safety that was once missing. Through targeted 200Hz binaural beats, Solfeggio frequencies, and a cataclysmic somatic release (scream), you will manually prune the unhealed patterns from your family tree. You emerge not just "relaxed," but reclaimed, standing in the truth of your own story with a newfound sense of agency and grounded peace.
    image: /images/9D Breathwork.jpg
