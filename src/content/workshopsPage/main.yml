workshops:
  - title: 9D Breathwork & Meditation Intensive
    date: July 19
    time: 2:30-4:45PM
    instructor: Garland Hume
    capacity: Limited to 14 students
    price: $75
    description: 'The Emergence: This journey is for people who feel they’ve reached the limits of what thinking alone can resolve and are carrying unprocessed emotional or internal pressure beneath the surface. It’s intended for those who have already done personal growth or healing work but still sense something deeper asking to be felt, released, or transformed—often alongside experiences like overwhelm, burnout, grief, nervous system dysregulation, or major identity shifts. Rather than offering passive relaxation, it is a somatic, immersive process that invites participants to move through intensity instead of avoiding it, building the capacity to stay present with challenging sensations and emotions while allowing space for release, surrender, and inner change.'
    image: /images/9D Breathwork.jpg
  - title: 'From Reflection to Action: A 7-Week Chakra Journey'
    date: Sundays, August 16-September 27
    time: 3-4:15PM
    instructor: Kat Clark
    capacity: Limited to 12 students
    price: $280
    description: 'We’re excited to welcome Kat Clark for REVERB: Embody Your Purpose, a 7-week chakra-based journey held Sundays from 3:00–4:15 PM at Kauai Hot Yoga, August 16 through September 27. This transformative series is designed to bridge the gap between self-awareness and action, helping participants move beyond cycles of reflection into aligned, purposeful living. Each session blends gentle movement, sound healing, nervous system repatterning, and guided workbook practices to support embodied growth, emotional integration, and inner resilience. REVERB offers a supportive space to deepen self-trust, cultivate clarity, and take courageous, grounded steps toward meaningful change.'
    image: /images/kat clark.jpg
benefits_heading: Workshop Benefits
benefits_intro: Workshops offer focused time to dive deeper into specific aspects of yoga practice. They are perfect for building skills, overcoming plateaus, and connecting with our community.
benefits:
  - title: Small Groups
    body: Limited capacity ensures personalized attention from instructors.
  - title: Deep Learning
