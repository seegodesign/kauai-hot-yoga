workshops:
  - title: 9D Breathwork & Meditation Intensive
    date: August 9
    time: 2:30-4:45PM
    instructor: Garland Hume
    capacity: Limited to 14 students
    price: $75
    description: |-
      You Are Enough 

      You Are Enough is a high-intensity transformational breathwork journey designed to help you release self-doubt, overcome fear of judgment, and reconnect with your inherent worth. Through a powerful progression of conscious breathing, connected mouth breathing, immersive 9D audio, transformational coaching, visualization, and emotional release, this experience guides you beyond limiting beliefs and into embodied self-belief.

      As the intensity builds, you’ll move through structured breath holds, full-body activation, primal vocal release, and deep emotional clearing, creating space to let go of shame, victimhood, and the stories that have kept you feeling small.

      The final integration shifts into gentle nasal breathing, heart-centered awareness, golden light visualization, and subconscious reinforcement, anchoring a new internal truth: you are enough exactly as you are.

      Designed for anyone ready to step beyond their comfort zone and lead with greater confidence, courage, and authenticity, You Are Enough offers a profound opportunity to reclaim your power.
    image: /images/9D Breathwork.jpg
  - title: 'From Reflection to Action: A 7-Week Chakra Journey'
    date: Sundays, August 16-September 27
    time: 3-4:15PM
    instructor: Kat Clark
    capacity: Limited to 12 students
    price: $280
    description: 'We’re excited to welcome Kat Clark for REVERB: Embody Your Purpose, a 7-week chakra-based journey held Sundays from 3:00–4:15 PM at Kauai Hot Yoga, August 16 through September 27. This transformative series is designed to bridge the gap between self-awareness and action, helping participants move beyond cycles of reflection into aligned, purposeful living. Each session blends gentle movement, sound healing, nervous system repatterning, and guided workbook practices to support embodied growth, emotional integration, and inner resilience. REVERB offers a supportive space to deepen self-trust, cultivate clarity, and take courageous, grounded steps toward meaningful change.'
    image: /images/kat clark.jpg
