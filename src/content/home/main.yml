why_hot_yoga_eyebrow: "The Science of Heat"
why_hot_yoga_heading: "Why Hot Yoga?"
why_hot_yoga_paragraphs:
  - "Hot yoga helps you relax and safely stretch muscles while improving flexibility, strength, and stamina. Heat accelerates the body's chemical processes - so you burn fat faster, break down acidity faster, and detox while flushing your body with oxygenated blood."
  - "People love the results from hot yoga: more energy, more confidence, less anxiety and pain. We recommend a minimum of three classes per week to see and maintain results. Our classes welcome beginners and all levels."
why_hot_yoga_cta: "Come see for yourself."
amenities_eyebrow: "Studio Amenities"
amenities_heading: "Everything You Need"
amenities:
  - title: "State-of-the-Art Studio"
    body: "The best in hot yoga heating and flooring technology for a premium practice environment."
  - title: "Showers & Changing Rooms"
    body: "Freshen up after class so you're ready to take on the rest of your day."
  - title: "Yoga Boutique"
    body: "Shop the latest hot yoga products and fashions at reasonable prices."
  - title: "Free Kangen Water"
    body: "Complimentary alkaline water for all students. Bring your refillable bottle!"
  - title: "Cold Plunge Bath"
    body: "State-of-the-art cold plunge - the perfect complement after a hot yoga class. Book via the Mindbody app."
new_here_section_heading: "New Here?"
new_here_quick_tips:
  - title: "What to Expect"
    body: "Our hot yoga classes are held in a climate-controlled studio heated to 95-105°F. Expect a welcoming atmosphere where all levels are supported."
  - title: "What to Bring"
    body: "Yoga mat, towel, water bottle, and an open mind. We provide filtered water and have showers available. Mats and towels available for rent."
  - title: "First Timer?"
    body: "Arrive 15 minutes early so we can get you set up. Our teachers will guide you through modifications and help you find your comfort zone."
