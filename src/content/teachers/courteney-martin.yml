name: Courteney Martin
title: Instructor
bio: |-
  Courteney Martin is a 500-hour E-RYT with over 15 years of experience teaching in a variety of yoga styles, including vinyasa, hatha, yin, sculpt, 26&2, and myofascial release. Her teaching blends mindful movement, breathwork, and somatic awareness to create classes that are both grounding and empowering.

  She is also a Licensed Clinical Social Worker (LCSW) and practicing therapist on island, bringing a trauma-informed and compassionate approach to her work. Courteney has trained with some of the most respected names in yoga and movement, and is passionate about helping students build strength, connection, and balance both on and off the mat.
