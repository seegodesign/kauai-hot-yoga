name: Yenna Abraham
title: Instructor
bio: My yoga practice started many many lifetimes ago. Since I was a little girl I found happiness playing in nature, stretching, breathing and connecting to the spirit of all. I have always felt comforted in the quiet spaces beneath the trees, sitting in a lotus position, letting myself go free. I don’t know where the curiosity for life came from at such a young age, but I imagine it started a long time ago before I was born. Now I’m just picking up where I left off one posture at a time. I was called to Kauai in 2016 because I wanted a personal evolution. I was feeling stuck in the corners of the city, needing to reach out my arms and touch the sky. It is what this practice is all about. we reach up to the light, we ground down to the Earth, and we pull in the forces of the universe that help us connect to the ultimate questions of our heart, to the space where our soul is, we’re all things harmonize. I like slow repetitive concentrated movements. I like long deep breaths and still eyes. I like music that vibrates deep within your body. Every class is guided by stars and comes from a space of deep love and wellness for all. May we transcend to the above and beyond together”
