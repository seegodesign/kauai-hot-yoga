name: Garland Hume
title: Owner & Lead Instructor
bio: Garland began her yoga journey in January 2007 and completed the 9-week Bikram Yoga teacher Training in Waikiki in the fall of 2007. In 2010 she became co-owner of two Bikram Yoga studios in Richmond, VA, before moving to Kauai in 2017 and opening Kauai Hot Yoga. Garland competed in yoga from 2009–2020 and served as Board President of USA Yoga, the national sporting organization, from 2017–2020. She has since expanded her teaching to Inferno Hot Pilates, Yin Yoga, Restorative Yoga, Vinyasa Yoga, Sound Bath, 9D Breathwork, and Reiki. Her mission is for every student to leave feeling like they had one of the best yoga experiences of their life.
