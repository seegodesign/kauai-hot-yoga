name: Lora Finelli
title: Instructor
bio: |-
  For me, the 26 & 2 asana series is more than just a work out, and has become a fundamental part of my health and happiness. My journey in yoga began as a practitioner in San Francisco in the early 2000’s, and I completed the intensive Bikram Yoga Teacher Training in 2009.  In the beginning stages of my career, I mostly traveled as a visiting teacher, working and often living in the yoga studios. Alongside this experience, I am a licensed massage therapist and fine art painter, and for the past 10 years I’ve been planting roots here on Kauai.

  In my classes, I honor the powerful traditional lineage of the Original Hot Yoga 26 & 2 series, and my goal is always to offer students the same strong foundation that has sustained me for nearly two decades.

  And when I'm not in the hot room, you can find me with a paintbrush and easel painting flowers, trees, and surreal landscapes.
